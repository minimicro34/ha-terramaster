name: Fix storage DeviceInfo typing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply DeviceInfo typing fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/terramaster/sensor.py")
          text = path.read_text()
          old = "        self._attr_device_info = {\n            \"identifiers\": {\n                (DOMAIN, object_id),\n            },\n            \"name\": device_name,\n            \"manufacturer\": \"TerraMaster\",\n            \"model\": (\n                f\"{'System ' if is_system else ''}\"\n                f\"{kind.capitalize()}\"\n            ),\n            \"via_device\": (\n                DOMAIN,\n                nas_id,\n            ),\n        }\n"
          new = "        self._attr_device_info = DeviceInfo(\n            identifiers={(DOMAIN, object_id)},\n            name=device_name,\n            manufacturer=\"TerraMaster\",\n            model=f\"{'System ' if is_system else ''}{kind.capitalize()}\",\n            via_device=(DOMAIN, nas_id),\n        )\n"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/terramaster/sensor.py
          git commit -m "Fix storage device info typing"
          git push
