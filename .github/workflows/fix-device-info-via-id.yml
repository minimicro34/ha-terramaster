name: Fix storage DeviceInfo typing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove deprecated via_device key
        run: sed -i '/^[[:space:]]*via_device=(DOMAIN, nas_id),[[:space:]]*$/d' custom_components/terramaster/sensor.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/terramaster/sensor.py
          git commit -m "Remove deprecated via_device from storage DeviceInfo"
          git push
