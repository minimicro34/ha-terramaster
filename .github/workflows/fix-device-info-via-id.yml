name: Fix storage DeviceInfo via_device_id

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply via_device_id migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/terramaster/sensor.py")
          text = path.read_text()

          old_import = "from homeassistant.helpers import entity_registry as er\n"
          new_import = (
              "from homeassistant.helpers import device_registry as dr\n"
              "from homeassistant.helpers import entity_registry as er\n"
          )
          if "from homeassistant.helpers import device_registry as dr\n" not in text:
              if old_import not in text:
                  raise SystemExit("entity_registry import anchor not found")
              text = text.replace(old_import, new_import, 1)

          old = "            via_device=(DOMAIN, nas_id),\n"
          new = '''            via_device_id=dr.async_get_device_id_by_identifier(
                coordinator.hass,
                (DOMAIN, nas_id),
                config_entry_id=entry.entry_id,
            ),
'''
          if old not in text:
              raise SystemExit("via_device anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/terramaster/sensor.py
          git commit -m "Use via_device_id for storage devices"
          git push
